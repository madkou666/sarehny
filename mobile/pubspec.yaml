name: sarehny_mobile
description: Arabic-first native Flutter client for Sarehny.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoKufiArabic
      fonts:
        - asset: NotoKufiArabic-Medium.ttf
          weight: 500
        - asset: NotoKufiArabic-Bold.ttf
          weight: 700
