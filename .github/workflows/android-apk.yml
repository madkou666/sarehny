name: Build Android APK (production or staging)

on:
  push:
    paths:
      - 'mobile/**'
      - 'deployment/api/v1/**'
      - 'deployment/hostinger-api-v1.zip'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Optional HTTPS staging API URL ending in /api/v1/. Leave empty to use the verified production API.'
        required: false
        type: string
        default: ''
      run_staging_integration:
        description: 'Run the Android app against the isolated staging API using repository secrets.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP 8.2 for syntax validation
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP API and verify delivery archive
        run: |
          php -l deployment/api/v1/index.php
          source_hash=$(sha256sum deployment/api/v1/index.php | cut -d ' ' -f 1)
          archive_hash=$(unzip -p deployment/hostinger-api-v1.zip api/v1/index.php | sha256sum | cut -d ' ' -f 1)
          test "$source_hash" = "$archive_hash"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: mobile/android/**/*.gradle*

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Dart sources
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter unit and widget tests
        working-directory: mobile
        run: flutter test

      - name: Validate optional staging API URL
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || '' }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          value = os.environ.get('API_BASE_URL', '').strip()
          if value:
              parsed = urlparse(value)
              host = (parsed.hostname or '').lower()
              is_staging_host = any(part in host for part in ('stage', 'staging', 'test', 'dev'))
              if parsed.scheme != 'https' or not host or not parsed.path.rstrip('/').endswith('/api/v1') or parsed.query or parsed.fragment or parsed.username or parsed.password or not is_staging_host:
                  raise SystemExit('Provide an HTTPS staging URL ending in /api/v1/; production hosts are not accepted.')
          PY

      - name: Verify Android connection to the production PHP API
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd mobile
            flutter test integration_test/production_connection_test.dart

      - name: Require a dedicated staging target and credentials
        if: github.event_name == 'workflow_dispatch' && inputs.run_staging_integration
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || '' }}
          STAGING_USERNAME: ${{ secrets.SAREHNY_STAGING_USERNAME }}
          STAGING_PASSWORD: ${{ secrets.SAREHNY_STAGING_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          value = os.environ.get('API_BASE_URL', '').strip()
          username = os.environ.get('STAGING_USERNAME', '')
          password = os.environ.get('STAGING_PASSWORD', '')
          parsed = urlparse(value)
          host = (parsed.hostname or '').lower()
          is_staging_host = any(part in host for part in ('stage', 'staging', 'test', 'dev'))
          if not value or not username or not password:
              raise SystemExit('Staging integration requires api_base_url plus SAREHNY_STAGING_USERNAME and SAREHNY_STAGING_PASSWORD GitHub secrets.')
          if parsed.scheme != 'https' or not host or not parsed.path.rstrip('/').endswith('/api/v1') or parsed.query or parsed.fragment or parsed.username or parsed.password or not is_staging_host:
              raise SystemExit('The staging integration accepts only an HTTPS staging/test/dev host ending in /api/v1/.')
          PY

      - name: Run Android end-to-end test against staging
        if: github.event_name == 'workflow_dispatch' && inputs.run_staging_integration
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url }}
          STAGING_USERNAME: ${{ secrets.SAREHNY_STAGING_USERNAME }}
          STAGING_PASSWORD: ${{ secrets.SAREHNY_STAGING_PASSWORD }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd mobile
            flutter test integration_test/staging_smoke_test.dart --dart-define="API_BASE_URL=$API_BASE_URL" --dart-define="STAGING_USERNAME=$STAGING_USERNAME" --dart-define="STAGING_PASSWORD=$STAGING_PASSWORD"

      - name: Build connected debug APK for production or staging
        working-directory: mobile
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || '' }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            flutter build apk --debug --dart-define="API_BASE_URL=$API_BASE_URL"
          else
            flutter build apk --debug
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarehny-android-debug-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summarize APK configuration
        if: success()
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || '' }}
          RUN_STAGING_INTEGRATION: ${{ inputs.run_staging_integration || false }}
        run: |
          {
            echo '## Android debug APK build complete'
            echo ''
            echo 'Download the `sarehny-android-debug-${{ github.run_number }}` artifact from this workflow run.'
            echo 'Flutter analysis, unit/widget tests, the Android production session connection test, and the debug APK build completed successfully.'
            if [ "$RUN_STAGING_INTEGRATION" = "true" ]; then
              echo 'The Android emulator staging integration test also completed successfully against the explicitly supplied staging URL.'
            elif [ -n "$API_BASE_URL" ]; then
              echo 'This APK is configured for the explicitly supplied staging URL; the production connection smoke test also passed.'
            else
              echo 'No staging URL was supplied; this APK uses the production API built into ApiConfig. The Android production session connection test passed.'
            fi
            echo 'The artifact is a debug APK, not a signed release build.'
          } >> "$GITHUB_STEP_SUMMARY"
