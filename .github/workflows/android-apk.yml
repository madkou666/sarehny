name: Build Android APK (staging or offline-safe)

on:
  push:
    paths:
      - 'mobile/**'
      - 'deployment/api/v1/**'
      - 'deployment/hostinger-api-v1.zip'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Optional HTTPS staging API URL ending in /api/v1/. Leave empty for an offline-safe build.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP 8.2 for syntax validation
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP API and verify delivery archive
        run: |
          php -l deployment/api/v1/index.php
          source_hash=$(sha256sum deployment/api/v1/index.php | cut -d ' ' -f 1)
          archive_hash=$(unzip -p deployment/hostinger-api-v1.zip api/v1/index.php | sha256sum | cut -d ' ' -f 1)
          test "$source_hash" = "$archive_hash"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: mobile/android/**/*.gradle*

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Dart sources
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter tests without API configuration
        working-directory: mobile
        run: flutter test

      - name: Validate optional staging API URL
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || '' }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          value = os.environ.get('API_BASE_URL', '').strip()
          if value:
              parsed = urlparse(value)
              host = (parsed.hostname or '').lower()
              is_staging_host = any(part in host for part in ('stage', 'staging', 'test', 'dev'))
              if parsed.scheme != 'https' or not host or not parsed.path.rstrip('/').endswith('/api/v1') or parsed.query or parsed.fragment or parsed.username or parsed.password or not is_staging_host:
                  raise SystemExit('Provide an HTTPS staging URL ending in /api/v1/; production hosts are not accepted.')
          PY

      - name: Build debug APK for staging or offline-safe use
        working-directory: mobile
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || '' }}
        run: flutter build apk --debug --dart-define="API_BASE_URL=$API_BASE_URL"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarehny-android-debug-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summarize APK configuration
        if: success()
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || '' }}
        run: |
          {
            echo '## Android debug APK build complete'
            echo ''
            echo 'Download the `sarehny-android-debug-${{ github.run_number }}` artifact from this workflow run.'
            echo 'Flutter analysis, unit/widget tests, and the debug APK build completed successfully.'
            if [ -n "$API_BASE_URL" ]; then
              echo 'This APK is configured for the explicitly supplied staging URL. CI did not send API requests to it.'
            else
              echo 'No API URL was configured; this is an offline-safe build and it will not connect to a server.'
            fi
            echo 'This does not verify login, messages, or server integration. The artifact is a debug APK, not a signed release build.'
          } >> "$GITHUB_STEP_SUMMARY"
