name: Build Android APK (API disabled)

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, and build offline debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: mobile/android/**/*.gradle*

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Dart sources
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Build offline installable debug APK
        working-directory: mobile
        run: flutter build apk --debug

      - name: Install and launch APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r mobile/build/app/outputs/flutter-apk/app-debug.apk
            adb shell am start -W -n com.sarehny.sarehny_mobile/.MainActivity
            adb shell 'for attempt in $(seq 1 20); do if pidof com.sarehny.sarehny_mobile; then exit 0; fi; sleep 1; done; exit 1'

      - name: Upload offline APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarehny-android-debug-offline-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summarize safe build
        if: success()
        run: |
          {
            echo '## Offline Android APK is ready'
            echo ''
            echo 'Download the `sarehny-android-debug-offline-${{ github.run_number }}` artifact from this workflow run.'
            echo 'No API_BASE_URL was supplied. API requests are disabled and the app does not contact production or a placeholder server.'
            echo 'Emulator launch proves app startup only; it does not prove API or database functionality.'
          } >> "$GITHUB_STEP_SUMMARY"
