name: Build Android APK (production API configured)

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, and build production-API debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: mobile/android/**/*.gradle*

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Dart sources
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter tests without API configuration
        working-directory: mobile
        run: flutter test

      - name: Build APK with production API base URL
        working-directory: mobile
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://sarehny.com/api/v1/

      - name: Upload production-API APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarehny-android-production-api-debug-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summarize APK configuration
        if: success()
        run: |
          {
            echo '## Production-API-configured Android APK is ready'
            echo ''
            echo 'Download the `sarehny-android-production-api-debug-${{ github.run_number }}` artifact from this workflow run.'
            echo 'Flutter analysis, unit/widget tests, and the debug APK build completed successfully.'
            echo 'The APK is configured for https://sarehny.com/api/v1/. CI tests ran without an API URL and did not contact the production server.'
            echo 'This confirms build configuration only; production endpoint availability, login, inbox reads, and message sending were not tested.'
            echo 'This is a debug APK and is not a signed release build.'
          } >> "$GITHUB_STEP_SUMMARY"
