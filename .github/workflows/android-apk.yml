name: Build Android APK (production or staging)

on:
  push:
    paths:
      - 'mobile/**'
      - 'deployment/api/v1/**'
      - 'deployment/hostinger-api-v1.zip'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Optional HTTPS staging API URL ending in /api/v1/. Leave empty to use the verified production API.'
        required: false
        type: string
        default: ''
      run_staging_integration:
        description: 'Run the Android app against the isolated staging API using repository secrets.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP 8.2 for syntax validation
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP API and verify delivery archive
        run: |
          php -l deployment/api/v1/index.php
          source_hash=$(sha256sum deployment/api/v1/index.php | cut -d ' ' -f 1)
          archive_hash=$(unzip -p deployment/hostinger-api-v1.zip api/v1/index.php | sha256sum | cut -d ' ' -f 1)
          test "$source_hash" = "$archive_hash"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: mobile/android/**/*.gradle*

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Dart sources
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter unit and widget tests
        working-directory: mobile
        run: flutter test

      - name: Validate optional staging API URL
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || '' }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          value = os.environ.get('API_BASE_URL', '').strip()
          if value:
              parsed = urlparse(value)
              host = (parsed.hostname or '').lower()
              is_staging_host = any(part in host for part in ('stage', 'staging', 'test', 'dev'))
              if parsed.scheme != 'https' or not host or not parsed.path.rstrip('/').endswith('/api/v1') or parsed.query or parsed.fragment or parsed.username or parsed.password or not is_staging_host:
                  raise SystemExit('Provide an HTTPS staging URL ending in /api/v1/; production hosts are not accepted.')
          PY

      - name: Require a dedicated staging target and credentials
        if: github.event_name == 'workflow_dispatch' && inputs.run_staging_integration
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || '' }}
          STAGING_USERNAME: ${{ secrets.SAREHNY_STAGING_USERNAME }}
          STAGING_PASSWORD: ${{ secrets.SAREHNY_STAGING_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          value = os.environ.get('API_BASE_URL', '').strip()
          username = os.environ.get('STAGING_USERNAME', '')
          password = os.environ.get('STAGING_PASSWORD', '')
          parsed = urlparse(value)
          host = (parsed.hostname or '').lower()
          is_staging_host = any(part in host for part in ('stage', 'staging', 'test', 'dev'))
          if not value or not username or not password:
              raise SystemExit('Staging integration requires api_base_url plus SAREHNY_STAGING_USERNAME and SAREHNY_STAGING_PASSWORD GitHub secrets.')
          if parsed.scheme != 'https' or not host or not parsed.path.rstrip('/').endswith('/api/v1') or parsed.query or parsed.fragment or parsed.username or parsed.password or not is_staging_host:
              raise SystemExit('The staging integration accepts only an HTTPS staging/test/dev host ending in /api/v1/.')
          PY

      - name: Run Android end-to-end test against staging
        if: github.event_name == 'workflow_dispatch' && inputs.run_staging_integration
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url }}
          STAGING_USERNAME: ${{ secrets.SAREHNY_STAGING_USERNAME }}
          STAGING_PASSWORD: ${{ secrets.SAREHNY_STAGING_PASSWORD }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd mobile && flutter test integration_test/staging_smoke_test.dart --dart-define="API_BASE_URL=$API_BASE_URL" --dart-define="STAGING_USERNAME=$STAGING_USERNAME" --dart-define="STAGING_PASSWORD=$STAGING_PASSWORD"

      - name: Build connected debug APK for production or staging
        working-directory: mobile
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || '' }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            flutter build apk --debug --dart-define="API_BASE_URL=$API_BASE_URL"
          else
            flutter build apk --debug
          fi

      - name: Upload debug APK artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: sarehny-android-debug-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Verify live production PHP API routes (read-only)
        id: production-api-contract
        env:
          API_BASE_URL: https://sarehny.com/api/v1/
        run: |
          python - <<'PY'
          import http.cookiejar
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from urllib.parse import urlparse

          base = os.environ['API_BASE_URL'].rstrip('/') + '/'
          origin = f"{urlparse(base).scheme}://{urlparse(base).netloc}"
          cookies = http.cookiejar.CookieJar()
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cookies))
          failures = []
          warnings = []

          def request(label, route=None, expected=None, blocked=None, fields=None, query=None, url=None):
              target = url or base + 'index.php?' + urllib.parse.urlencode({'r': route, **(query or {})})
              data = urllib.parse.urlencode(fields).encode() if fields is not None else None
              headers = {'Accept': 'application/json', 'Cache-Control': 'no-cache', 'User-Agent': 'SarehnyAndroidRouteCheck/1.0'}
              req = urllib.request.Request(target, data=data, headers=headers)
              try:
                  with client.open(req, timeout=20) as response:
                      status, content_type, body = response.status, response.headers.get('Content-Type', ''), response.read(2000).decode('utf-8', 'replace')
              except urllib.error.HTTPError as error:
                  status, content_type, body = error.code, error.headers.get('Content-Type', ''), error.read(2000).decode('utf-8', 'replace')
              try:
                  payload = json.loads(body) if 'json' in content_type.lower() else None
              except json.JSONDecodeError:
                  payload = None
              if blocked is not None and status == blocked:
                  result = 'BLOCKED'
                  warnings.append(f'{label}: authentication is required; this is not a successful feature test')
              elif expected is not None:
                  passed = status == expected
                  result = 'PASS' if passed else 'FAIL'
                  if not passed:
                      failures.append(f'{label}: expected HTTP {expected}, received {status}')
              elif blocked is not None:
                  result = 'FAIL'
                  failures.append(f'{label}: expected authentication block HTTP {blocked}, received {status}')
              else:
                  result = 'PASS' if status == 200 else 'WARNING'
              print(f'{result} {label}: HTTP {status}; {body[:240]}')
              return status, payload, content_type

          home_status, _, home_type = request('website homepage', expected=200, url=origin + '/')
          if 'html' not in home_type.lower(): failures.append('website homepage did not return HTML')

          session_status, session, _ = request('GET index.php?r=session', 'session', 200)
          csrf = session.get('csrf') if isinstance(session, dict) else None
          if not isinstance(session, dict) or session.get('ok') is not True or not isinstance(csrf, str) or not csrf:
              failures.append('session response is missing a valid CSRF token')

          request('GET index.php?r=app-theme', 'app-theme', 200)
          request('GET index.php?r=account (login required; not feature-tested)', 'account', blocked=401)
          request('GET index.php?r=inbox (login required; not feature-tested)', 'inbox', blocked=401)
          request('GET index.php?r=public-profile with invalid input', 'public-profile', 422, query={'username': '!'})

          if isinstance(csrf, str) and csrf:
              request('POST index.php?r=auth/login with empty test fields (no account lookup)', 'auth/login', 422, fields={'csrf': csrf, 'identifier': '', 'password': ''})
          else:
              failures.append('login route was not tested because the session CSRF token is unavailable')

          rewrite_status, _, rewrite_type = request('optional /session rewrite alias', expected=None, url=base + 'session')
          if rewrite_status != 200:
              warnings.append('The optional /api/v1/session rewrite alias is unavailable; Flutter uses index.php?r=session and does not depend on mod_rewrite.')
          for warning in warnings: print('WARNING ' + warning)
          if failures:
              raise SystemExit('Production API route contract failed: ' + '; '.join(failures))
          print('Production PHP API read-only route checks passed.')
          PY

      - name: Reclaim runner space before Android emulator
        if: always() && steps.upload-apk.outcome == 'success'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/local/share/chromium
          sudo apt-get clean
          df -h /

      - name: Verify Android connection to the production PHP API
        id: android-production-smoke
        if: always() && steps.upload-apk.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 30
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd mobile && flutter test integration_test/production_connection_test.dart

      - name: Summarize APK and production API checks
        if: always()
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || '' }}
          RUN_STAGING_INTEGRATION: ${{ inputs.run_staging_integration || false }}
          BUILD_OUTCOME: ${{ steps.upload-apk.outcome }}
          API_OUTCOME: ${{ steps.production-api-contract.outcome }}
          ANDROID_OUTCOME: ${{ steps.android-production-smoke.outcome }}
        run: |
          {
            echo '## Android debug APK and live API verification'
            echo ''
            echo 'Artifact upload: **'"$BUILD_OUTCOME"'** (`sarehny-android-debug-${{ github.run_number }}`).'
            echo 'Production PHP API route checks: **'"$API_OUTCOME"'**.'
            echo 'Android emulator connection test: **'"$ANDROID_OUTCOME"'**.'
            if [ "$RUN_STAGING_INTEGRATION" = "true" ]; then
              echo 'The isolated staging-account end-to-end test was requested.'
            else
              echo 'No login credentials or production data mutations were used by the read-only production smoke tests.'
            fi
            echo 'The artifact is a debug APK, not a signed release build. An APK build alone does not establish that missing production PHP routes have been deployed.'
          } >> "$GITHUB_STEP_SUMMARY"
